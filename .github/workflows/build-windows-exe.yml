name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'src/AppForgeInstaller/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appforge-windows-exe
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Generate AppForge brand icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp=New-Object System.Drawing.Bitmap 256,256; $g=[System.Drawing.Graphics]::FromImage($bmp); $g.SmoothingMode='AntiAlias'; $g.Clear([System.Drawing.Color]::Transparent)
          $g.FillRectangle((New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255,8,17,31))),10,10,236,236)
          $rect=[System.Drawing.Rectangle]::new(18,18,220,220); $grad=New-Object System.Drawing.Drawing2D.LinearGradientBrush $rect,([System.Drawing.Color]::FromArgb(255,110,231,255)),([System.Drawing.Color]::FromArgb(255,167,139,250)),45; $g.FillRectangle($grad,18,18,220,220)
          $inner=New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255,7,17,30)); $sf=New-Object System.Drawing.StringFormat; $sf.Alignment='Center'; $sf.LineAlignment='Center'
          $g.DrawString('A',(New-Object System.Drawing.Font('Segoe UI',112,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)),$inner,[System.Drawing.RectangleF]::new(22,26,160,195),$sf)
          $g.DrawString('i',(New-Object System.Drawing.Font('Segoe UI',70,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)),$inner,[System.Drawing.RectangleF]::new(153,66,72,130),$sf)
          $g.Dispose(); $ico=[System.Drawing.Icon]::FromHandle($bmp.GetHicon()); $fs=[System.IO.File]::Create('src/AppForgeInstaller/appforge.ico'); $ico.Save($fs); $fs.Close(); $bmp.Dispose()

      - name: Normalize GUI source before build
        shell: pwsh
        run: |
          $path='src/AppForgeInstaller/Program.cs'
          $s=[System.IO.File]::ReadAllText($path,[System.Text.UTF8Encoding]::new($false))
          $s=$s.Replace('        Text = "AppForge Installer";','        base.Text = "AppForge Installer";')
          [System.IO.File]::WriteAllText($path,$s,[System.Text.UTF8Encoding]::new($false))

      - name: Verify GUI source stays valid UTF-8
        shell: pwsh
        run: |
          $path='src/AppForgeInstaller/Program.cs'
          $bytes=[System.IO.File]::ReadAllBytes($path)
          $strict=[System.Text.UTF8Encoding]::new($false,$true)
          $text=$strict.GetString($bytes)
          if($text.Contains('â€¦') -or $text.Contains('â†') -or $text.Contains('ï¿½')){throw 'Mojibake detected in GUI source'}

      - name: Publish self-contained compressed EXE
        run: dotnet publish src/AppForgeInstaller/AppForgeInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Sign EXE when trusted certificate is configured
        shell: pwsh
        run: |
          if([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)){Write-Host 'No trusted signing certificate configured.'; exit 0}
          $pfx=Join-Path $env:RUNNER_TEMP 'appforge-signing.pfx'; [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe'|Sort-Object FullName -Descending|Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD publish/AppForge.exe
          if($LASTEXITCODE-ne 0){throw 'Authenticode signing failed'}

      - name: Validate Windows executable
        shell: pwsh
        run: |
          $file='publish/AppForge.exe'; if(-not(Test-Path $file)){throw 'EXE not produced'}; $size=(Get-Item $file).Length
          if($size-lt 10MB-or $size-ge 95MB){throw "Invalid EXE size: $size"}
          $stream=[IO.File]::OpenRead($file); try{$a=$stream.ReadByte();$b=$stream.ReadByte()}finally{$stream.Dispose()}; if($a-ne 0x4D-or $b-ne 0x5A){throw 'Invalid MZ header'}
          Copy-Item $file publish/AppForge-Windows.exe -Force; (Get-FileHash $file -Algorithm SHA256).Hash|Set-Content -NoNewline publish/AppForge-Windows.exe.sha256

      - name: Publish latest Windows release asset
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if ! gh release view appforge-latest >/dev/null 2>&1; then gh release create appforge-latest --target "${GITHUB_SHA}" --title "AppForge Latest Windows Build" --notes "Latest validated AppForge Windows installer."; fi
          gh release upload appforge-latest publish/AppForge-Windows.exe publish/AppForge-Windows.exe.sha256 --clobber
          SIZE=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/appforge-latest --jq '.assets[] | select(.name=="AppForge-Windows.exe") | .size')
          if [ -z "$SIZE" ] || [ "$SIZE" -lt 10485760 ]; then exit 1; fi

      - name: Sync validated EXE to GitHub Pages download
        shell: bash
        run: |
          cp publish/AppForge-Windows.exe downloads/AppForge-Windows.exe
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add downloads/AppForge-Windows.exe
          git diff --cached --quiet && exit 0
          git commit -m "Sync validated Windows installer for website downloads"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
