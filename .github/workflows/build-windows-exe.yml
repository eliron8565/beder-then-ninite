name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'src/AppForgeInstaller/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appforge-windows-exe
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate AppForge brand icon
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::Transparent)
          $dark = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255,8,17,31))
          $g.FillRectangle($dark, 10, 10, 236, 236)
          $rect = [System.Drawing.Rectangle]::new(18,18,220,220)
          $grad = New-Object System.Drawing.Drawing2D.LinearGradientBrush $rect, ([System.Drawing.Color]::FromArgb(255,110,231,255)), ([System.Drawing.Color]::FromArgb(255,167,139,250)), 45
          $g.FillRectangle($grad, 18, 18, 220, 220)
          $inner = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255,7,17,30))
          $fontA = New-Object System.Drawing.Font('Segoe UI',112,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
          $fontI = New-Object System.Drawing.Font('Segoe UI',70,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
          $sf = New-Object System.Drawing.StringFormat
          $sf.Alignment = [System.Drawing.StringAlignment]::Center
          $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
          $g.DrawString('A',$fontA,$inner,[System.Drawing.RectangleF]::new(22,26,160,195),$sf)
          $g.DrawString('i',$fontI,$inner,[System.Drawing.RectangleF]::new(153,66,72,130),$sf)
          $g.Dispose()
          $hIcon = $bmp.GetHicon()
          $ico = [System.Drawing.Icon]::FromHandle($hIcon)
          $fs = [System.IO.File]::Create('src/AppForgeInstaller/appforge.ico')
          $ico.Save($fs)
          $fs.Close()
          $bmp.Dispose()

      - name: Publish self-contained single-file EXE
        run: dotnet publish src/AppForgeInstaller/AppForgeInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Sign EXE when trusted certificate is configured
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host "No Windows code-signing certificate configured. EXE will remain unsigned until SignPath/trusted signing is connected."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'appforge-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found on the GitHub runner.' }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD publish/AppForge.exe
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed.' }
          & $signtool.FullName verify /pa /v publish/AppForge.exe
          Remove-Item $pfx -Force

      - name: Check EXE size
        shell: powershell
        run: |
          $size = (Get-Item publish/AppForge.exe).Length
          Write-Host "AppForge EXE size: $([math]::Round($size / 1MB, 2)) MB"
          if ($size -ge 95MB) { throw "EXE is too large for repository publishing." }

      - name: Copy EXE to website
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          Copy-Item publish/AppForge.exe downloads/AppForge-Windows.exe -Force

      - name: Commit built EXE safely
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AppForge-Windows.exe
          if git diff --cached --quiet; then echo "EXE unchanged"; exit 0; fi
          git commit -m "Build AppForge Windows EXE"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 3
          done
          exit 1
