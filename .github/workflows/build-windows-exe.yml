name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'src/AppForgeInstaller/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appforge-windows-exe
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate AppForge icon
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::FromArgb(8,17,31))
          $brush = New-Object System.Drawing.Drawing2D.LinearGradientBrush ([System.Drawing.Rectangle]::new(16,16,224,224)), ([System.Drawing.Color]::FromArgb(104,224,255)), ([System.Drawing.Color]::FromArgb(167,148,255)), 45
          $g.FillRectangle($brush, 22,22,212,212)
          $font = New-Object System.Drawing.Font('Segoe UI',76,[System.Drawing.FontStyle]::Bold)
          $sf = New-Object System.Drawing.StringFormat
          $sf.Alignment = [System.Drawing.StringAlignment]::Center
          $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
          $g.DrawString('AF',$font,[System.Drawing.Brushes]::Black,[System.Drawing.RectangleF]::new(0,0,256,256),$sf)
          $g.Dispose()
          $hIcon = $bmp.GetHicon()
          $ico = [System.Drawing.Icon]::FromHandle($hIcon)
          $fs = [System.IO.File]::Create('src/AppForgeInstaller/appforge.ico')
          $ico.Save($fs)
          $fs.Close()
          $bmp.Dispose()

      - name: Publish compact single-file EXE
        run: dotnet publish src/AppForgeInstaller/AppForgeInstaller.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Check EXE size
        shell: powershell
        run: |
          $size = (Get-Item publish/AppForge-Windows.exe).Length
          Write-Host "AppForge EXE size: $([math]::Round($size / 1MB, 2)) MB"
          if ($size -ge 95MB) { throw "EXE is too large for GitHub Pages repository publishing." }

      - name: Copy EXE to website
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          Copy-Item publish/AppForge-Windows.exe downloads/AppForge-Windows.exe -Force

      - name: Commit built EXE safely
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AppForge-Windows.exe
          if git diff --cached --quiet; then
            echo "EXE unchanged"
            exit 0
          fi
          git commit -m "Build AppForge Windows EXE"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 3
          done
          echo "Failed to publish EXE after retries"
          exit 1
