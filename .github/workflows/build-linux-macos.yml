name: Build Linux and macOS

on:
  push:
    branches: [ main ]
    paths:
      - 'src/crossplatform/**'
      - '.github/workflows/build-linux-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2
          python -m pip install --upgrade pip pyinstaller
      - name: Build GUI binary
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name AppForge src/crossplatform/appforge_installer.py
          mkdir -p AppDir/usr/bin
          cp dist/AppForge AppDir/usr/bin/AppForge
          cp favicon.svg AppDir/appforge.svg
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/AppForge" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/appforge.desktop <<'EOF'
          [Desktop Entry]
          Name=AppForge
          Exec=AppForge
          Icon=appforge
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir AppForge-Linux.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-file
          path: AppForge-Linux.AppImage

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build macOS app
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --windowed --name AppForge src/crossplatform/appforge_installer.py
          ditto -c -k --sequesterRsrc --keepParent dist/AppForge.app AppForge-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac-file
          path: AppForge-macOS.zip

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: linux-file
          path: built
      - uses: actions/download-artifact@v4
        with:
          name: mac-file
          path: built
      - name: Publish files
        run: |
          mkdir -p downloads
          cp built/AppForge-Linux.AppImage downloads/AppForge-Linux.AppImage
          cp built/AppForge-macOS.zip downloads/AppForge-macOS.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AppForge-Linux.AppImage downloads/AppForge-macOS.zip
          git commit -m "Update Linux and macOS AppForge builds" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
